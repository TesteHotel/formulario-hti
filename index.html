<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitação de Hospedagem - Hotel de Trânsito de Itaqui</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ... (Mantenha o seu CSS original intacto) ... */
        .campo-upload { margin-top: 10px; border: 2px dashed #cbd5e1; padding: 20px; border-radius: 8px; text-align: center; }
    </style>
</head>
<body>

<div class="container-publico" id="conteudoFormulario">
    <header class="topo-publico">
        <img src="Logo HTI - novo.jpg" class="logo-ht">
        <h1>Solicitação de Hospedagem</h1>
        <p class="subtitulo">Hotel de Trânsito de Itaqui — Canal Externo</p>
    </header>

    <form id="formReservaPublica">
        <fieldset class="card-secao" style="border: 1px solid var(--border-color); margin: 0 0 24px 0;">
            <h2>📁 Anexar Documentação</h2>
            <div class="campo campo-upload">
                <label>RG / Identidade Militar / Comprovante (PDF, PNG, JPG)</label>
                <input type="file" id="documentos" multiple accept=".pdf,.png,.jpg,.jpeg">
                <small style="color: #64748b;">Você pode selecionar múltiplos arquivos.</small>
            </div>
        </fieldset>

        <div class="botoes-finais">
            <button type="submit" id="btnEnviar" class="btn-enviar">Submeter Intenção de Reserva</button>
        </div>
    </form>
</div>

<div class="container-publico sucesso-tela" id="telaSucesso">
    <h2>🎉 Solicitação Enviada!</h2>
    <p>Sua intenção de reserva e documentos foram cadastrados com sucesso.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = 'https://tyubyspelmqhgahsdwfr.supabase.co/rest/v1/';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5dWJ5c3BlbG1xaGdhaHNkd2ZyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwMTcwMTIsImV4cCI6MjA5NjU5MzAxMn0.xZKWcq_w3FgHNRtvezXZhY8xbBWYxTjBMLWCUQ9N-bQ';

    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById("formReservaPublica").addEventListener("submit", async function(e) {
        e.preventDefault();

        const btn = document.getElementById("btnEnviar");
        btn.disabled = true;
        btn.innerText = "Processando upload e reserva...";

        // 1. LÓGICA DE UPLOAD PARA SUPABASE STORAGE
        const inputArquivos = document.getElementById('documentos');
        const nomesArquivos = [];

        if (inputArquivos.files.length > 0) {
            for (const arquivo of inputArquivos.files) {
                const nomeUnico = `${Date.now()}_${Math.random().toString(36).substr(2, 9)}_${arquivo.name}`;
                const { data, error } = await supabaseClient.storage
                    .from('documentos-hospedes') // Certifique-se que o bucket existe
                    .upload(nomeUnico, arquivo);

                if (!error) {
                    nomesArquivos.push(nomeUnico);
                } else {
                    console.error("Erro no upload: ", error.message);
                }
            }
        }

        // 2. CADASTRO DE RESERVAS (Incluindo os nomes dos arquivos)
        const dadosReserva = {
            cpf: document.getElementById("cpf_publico").value,
            nome_completo: document.getElementById("nome_completo").value,
            // ... (coloque aqui o restante dos seus campos originais)
            documentos_digitalizados: nomesArquivos.join(","), // Salva a lista como string
            status: 'Pendente'
        };

        const { data: reservaCriada, error: erroReserva } = await supabaseClient
            .from('reservas')
            .insert([dadosReserva])
            .select();

        if (erroReserva) {
            alert("Erro ao submeter: " + erroReserva.message);
            btn.disabled = false;
            btn.innerText = "Submeter Intenção de Reserva";
            return;
        }

        // ... (resto da lógica de salvar dependentes permanece igual)
        
        document.getElementById("conteudoFormulario").style.display = "none";
        document.getElementById("telaSucesso").style.display = "block";
    });
</script>
</body>
</html>
